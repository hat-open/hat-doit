[project]
name = "hat-doit"
version = "0.16.5"
description = "Hat build utility functions"
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "dependency-groups >=1.3.2",
    "doit >=0.37.0",
    "flake8 >=7.3.0",
    "furo >=2025.12.19",
    "mkwhl ~=0.3.2",
    "packaging >=26.3",
    "pdoc >=16.0.0",
    "pip >=26.2.2",
    "pytest >=9.2.0",
    "pytest-asyncio >=1.4.1",
    "pytest-cov >=7.1.0",
    "pytest-timeout >=2.4.0",
    "sphinx >=8.1.3",
    "tomli >=2.5.0; python_version<'3.11'",
    "watchdog >=6.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License"
]

[project.urls]
Homepage = "https://hat-open.com"
Repository = "https://github.com/hat-open/hat-doit.git"

[dependency-groups]
run = [
    "dependency-groups >=1.3.2",
    "doit >=0.37.0",
    "flake8 >=7.3.0",
    "furo >=2025.12.19",
    "mkwhl ~=0.3.2",
    "packaging >=26.3",
    "pdoc >=16.0.0",
    "pip >=26.2.2",
    "pytest >=9.2.0",
    "pytest-asyncio >=1.4.1",
    "pytest-cov >=7.1.0",
    "pytest-timeout >=2.4.0",
    "sphinx >=8.1.3",
    "tomli >=2.5.0; python_version<'3.11'",
    "watchdog >=6.0.0",
]
build = [
    {include-group = "run"},
]
dev = [
    {include-group = "run"},
    {include-group = "build"},
]

[build-system]
build-backend = "hat.doit.pep517"
backend-path = ["src_py"]
requires = [
    "dependency-groups >=1.3.2",
    "doit >=0.37.0",
    "packaging >=26.3",
    "tomli >=2.5.0; python_version<'3.11'",
    "watchdog >=6.0.0"
]
