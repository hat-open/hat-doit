[project]
name = "hat-doit"
version = "0.16.2"
description = "Hat build utility functions"
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "doit >=0.37.0",
    "flake8 >=7.3.0",
    "furo >=2025.12.19",
    "mkwhl ~=0.3.1",
    "packaging >=26.0",
    "pdoc >=16.0.0",
    "pytest >=8.4.2",
    "pytest-asyncio >=1.3.0",
    "pytest-cov >=7.0.0",
    "pytest-timeout >=2.4.0",
    "sphinx >=9.1.0",
    "tomli >=2.4.0; python_version<'3.11'",
    "watchdog >=6.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License"
]

[project.urls]
Homepage = "http://hat-open.com"
Repository = "https://github.com/hat-open/hat-doit.git"

[build-system]
build-backend = "hat.doit.pep517"
backend-path = ["src_py"]
requires = [
    "doit >=0.37.0",
    "packaging >=26.0",
    "tomli >=2.4.0; python_version<'3.11'",
    "watchdog >=6.0.0"
]
